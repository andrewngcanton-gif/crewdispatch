name: Installer CI

on:
  push:
    branches: [installer-0.1.9]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify complete-uninstall safety on Windows
        shell: pwsh
        run: node --test dist/tests/unit/data-root-purge.test.js dist/tests/integration/complete-uninstall.test.js
      - name: Build exact Windows payload
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'crewdispatch-candidate'
          New-Item -ItemType Directory -Force $candidate | Out-Null
          node scripts/build-release-candidate.cjs --output-dir $candidate --scope command-code+workbuddy-ai | Tee-Object -FilePath (Join-Path $candidate 'report.stdout.json')
          $zip = Get-ChildItem $candidate -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Windows payload ZIP missing' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'crewdispatch-unpacked'
          Expand-Archive -Path $zip.FullName -DestinationPath $unpacked -Force
          "CREWDISPATCH_WINDOWS_CANDIDATE=$candidate" >> $env:GITHUB_ENV
          "CREWDISPATCH_WINDOWS_UNPACKED=$unpacked" >> $env:GITHUB_ENV
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build setup EXE
        shell: pwsh
        run: |
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { $makensis = 'C:\Program Files\NSIS\makensis.exe' }
          if (-not (Test-Path $makensis)) { throw 'makensis.exe not found after NSIS install' }
          $env:MAKENSIS = $makensis
          New-Item -ItemType Directory -Force installer-out | Out-Null
          node scripts/build-windows-installer.cjs --payload-dir $env:CREWDISPATCH_WINDOWS_UNPACKED --output installer-out/CrewDispatch-Setup-0.1.9.exe | Tee-Object -FilePath installer-out/windows-installer.json
          New-Item -ItemType Directory -Force installer-out/candidate | Out-Null
          Copy-Item (Join-Path $env:CREWDISPATCH_WINDOWS_CANDIDATE '*') installer-out/candidate -Force
          if (-not (Test-Path installer-out/CrewDispatch-Setup-0.1.9.exe)) { throw 'setup EXE missing' }
      - name: Verify visible Windows welcome page
        shell: pwsh
        run: |
          ./scripts/test-windows-installer-ui.ps1 `
            -Setup installer-out/CrewDispatch-Setup-0.1.9.exe `
            -Version 0.1.9 `
            -Screenshot installer-out/windows-welcome.png
      - name: Stage Codex Desktop CLI ownership fixture
        shell: pwsh
        run: |
          $fakeDir = Join-Path $env:RUNNER_TEMP 'crewdispatch-fake-codex'
          New-Item -ItemType Directory -Force $fakeDir | Out-Null
          $state = Join-Path $fakeDir 'state.json'
          '{"marketplace":false,"plugin":false,"target":null}' | Set-Content -Encoding utf8 $state
          @'
          const fs = require('node:fs');
          const path = require('node:path');
          const args = process.argv.slice(2);
          const statePath = process.env.CREWDISPATCH_FAKE_CODEX_STATE;
          let state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          const save = () => fs.writeFileSync(statePath, JSON.stringify(state));
          const json = (value) => process.stdout.write(`${JSON.stringify(value)}\n`);
          const isMarketplaceAdd = args[0] === 'plugin' && args[1] === 'marketplace' && args[2] === 'add';
          const isMarketplaceList = args[0] === 'plugin' && args[1] === 'marketplace' && args[2] === 'list';
          const isMarketplaceRemove = args[0] === 'plugin' && args[1] === 'marketplace' && args[2] === 'remove';
          const isPluginAdd = args[0] === 'plugin' && args[1] === 'add';
          const isPluginList = args[0] === 'plugin' && args[1] === 'list';
          const isPluginRemove = args[0] === 'plugin' && args[1] === 'remove';
          if (isMarketplaceAdd) {
            state.target = args[3]; state.marketplace = true; save(); json({ marketplaceName: 'crewdispatch-local', installedRoot: state.target });
          } else if (isPluginAdd) {
            state.plugin = true; save(); json({ pluginId: 'crewdispatch@crewdispatch-local' });
          } else if (isPluginList) {
            const manifest = state.target && path.join(state.target, '.agents', 'plugins', 'marketplace.json');
            if (!state.marketplace || !manifest || !fs.existsSync(manifest)) {
              console.error(`Error: failed to load configured marketplace snapshot(s): crewdispatch-local at ${state.target}`); process.exit(1);
            }
            const source = `\\\\?\\${state.target}`;
            json({ installed: state.plugin ? [{ pluginId: 'crewdispatch@crewdispatch-local', marketplaceSource: { sourceType: 'local', source } }] : [], available: [] });
          } else if (isPluginRemove) {
            state.plugin = false; save(); json({ pluginId: 'crewdispatch@crewdispatch-local' });
          } else if (isMarketplaceList) {
            const manifest = state.target && path.join(state.target, '.agents', 'plugins', 'marketplace.json');
            if (!state.marketplace || !manifest || !fs.existsSync(manifest)) {
              console.error(`Error: failed to load marketplace(s): crewdispatch-local at ${state.target}`); process.exit(1);
            }
            const root = `\\\\?\\${state.target}`;
            json({ marketplaces: [{ name: 'crewdispatch-local', root }] });
          } else if (isMarketplaceRemove) {
            state.marketplace = false; save(); json({ marketplaceName: 'crewdispatch-local', installedRoot: null });
          } else {
            console.error(`unexpected fake Codex argv: ${args.join(' ')}`); process.exit(2);
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $fakeDir 'fake-codex.cjs')
          @'
          @echo off
          node "%~dp0fake-codex.cjs" %*
          '@ | Set-Content -Encoding ascii (Join-Path $fakeDir 'codex.cmd')
          "CODEX_CLI_PATH=$(Join-Path $fakeDir 'codex.cmd')" >> $env:GITHUB_ENV
          "CREWDISPATCH_FAKE_CODEX_STATE=$state" >> $env:GITHUB_ENV
      - name: Silent install and uninstall lifecycle
        shell: pwsh
        run: |
          $setup = (Resolve-Path installer-out/CrewDispatch-Setup-0.1.9.exe).Path
          $install = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "setup failed: $($install.ExitCode)" }
          $target = Join-Path $env:LOCALAPPDATA 'Programs\CrewDispatch'
          if (-not (Test-Path (Join-Path $target '.jobquay-install.json'))) { throw 'managed install marker missing' }
          $pkg = Get-Content (Join-Path $target 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '0.1.9') { throw "unexpected installed version $($pkg.version)" }
          $codexPrompt = Join-Path $HOME '.codex\prompts\crewdispatch.md'
          $codexManifest = Join-Path $HOME '.codex\crewdispatch-install.json'
          $claudeCommand = Join-Path $HOME '.claude\commands\crewdispatch.md'
          $claudeSkill = Join-Path $HOME '.claude\skills\crewdispatch\SKILL.md'
          $claudeManifest = Join-Path $HOME '.claude\crewdispatch-install.json'
          foreach ($file in @($codexPrompt, $codexManifest, $claudeCommand, $claudeSkill, $claudeManifest)) {
            if (-not (Test-Path $file)) { throw "caller integration missing: $file" }
          }
          $fakeCodexAfterInstall = Get-Content $env:CREWDISPATCH_FAKE_CODEX_STATE -Raw | ConvertFrom-Json
          if (-not $fakeCodexAfterInstall.marketplace -or -not $fakeCodexAfterInstall.plugin) { throw 'Codex plugin/marketplace fixture was not installed' }
          $claudeConfig = Join-Path $HOME '.claude.json'
          if (-not (Test-Path $claudeConfig)) { throw 'Claude user MCP config missing' }
          $claudeJson = Get-Content $claudeConfig -Raw | ConvertFrom-Json
          if (-not $claudeJson.mcpServers.crewdispatch) { throw 'Claude CrewDispatch MCP registration missing' }
          $claudeSettingsFile = Join-Path $HOME '.claude\settings.json'
          if (-not (Test-Path $claudeSettingsFile)) { throw 'Claude settings/hooks file missing' }
          $claudeSettings = Get-Content $claudeSettingsFile -Raw | ConvertFrom-Json
          if (-not $claudeSettings.hooks.SessionStart -or -not $claudeSettings.hooks.SessionEnd) { throw 'Claude CrewDispatch lifecycle hooks missing' }
          ./scripts/assert-windows-installed-app.ps1 -Version 0.1.9 -InstallLocation $target
          $uninstaller = Join-Path $target 'Uninstall.exe'
          if (-not (Test-Path $uninstaller)) { throw 'uninstaller missing' }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "uninstall failed: $($remove.ExitCode)" }
          if (Test-Path (Join-Path $target '.jobquay-install.json')) { throw 'managed install marker survived uninstall' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CrewDispatch') { throw 'Installed Apps registration survived uninstall' }
          if (Test-Path $target) { throw 'fresh install target survived uninstall' }
          foreach ($file in @($codexPrompt, $codexManifest, $claudeCommand, $claudeSkill, $claudeManifest)) {
            if (Test-Path $file) { throw "caller integration survived uninstall: $file" }
          }
          $fakeCodexAfterUninstall = Get-Content $env:CREWDISPATCH_FAKE_CODEX_STATE -Raw | ConvertFrom-Json
          if ($fakeCodexAfterUninstall.plugin -or $fakeCodexAfterUninstall.marketplace) { throw 'Codex plugin/marketplace registration survived uninstall' }
          if (Test-Path $claudeConfig) {
            $claudeJsonAfter = Get-Content $claudeConfig -Raw | ConvertFrom-Json
            if ($claudeJsonAfter.mcpServers.crewdispatch) { throw 'Claude CrewDispatch MCP registration survived uninstall' }
            if (Test-Path $claudeSettingsFile) {
              $claudeSettingsAfter = Get-Content $claudeSettingsFile -Raw | ConvertFrom-Json
              if ($claudeSettingsAfter.hooks.SessionStart -or $claudeSettingsAfter.hooks.SessionEnd) { throw 'Claude CrewDispatch lifecycle hooks survived uninstall' }
            }
          }
      - name: Verify immutable 0.1.8 to 0.1.9 in-place upgrade metadata
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'CrewDispatch-Setup-0.1.8.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/andrewngcanton-gif/crewdispatch/releases/download/v0.1.8/CrewDispatch-Setup-0.1.8.exe' `
            -OutFile $baseline
          $baselineHash = (Get-FileHash -Algorithm SHA256 $baseline).Hash.ToLowerInvariant()
          if ($baselineHash -ne '2698984322f8c127d21714abd0b6e2638c6a8bea8df6f6e6443032efda95aecc') {
            throw "0.1.8 upgrade baseline SHA-256 mismatch: $baselineHash"
          }

          $target = Join-Path $env:LOCALAPPDATA 'Programs\CrewDispatch'
          $oldInstall = Start-Process -FilePath $baseline -ArgumentList '/S' -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "0.1.8 setup failed: $($oldInstall.ExitCode)" }
          $oldPkg = Get-Content (Join-Path $target 'package.json') -Raw | ConvertFrom-Json
          if ($oldPkg.version -ne '0.1.8') { throw "unexpected baseline installed version $($oldPkg.version)" }
          ./scripts/assert-windows-installed-app.ps1 -Version 0.1.8 -InstallLocation $target
          $oldMarker = Get-Content (Join-Path $target '.jobquay-install.json') -Raw | ConvertFrom-Json

          $setup = (Resolve-Path installer-out/CrewDispatch-Setup-0.1.9.exe).Path
          $upgrade = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "0.1.9 upgrade failed: $($upgrade.ExitCode)" }
          $newPkg = Get-Content (Join-Path $target 'package.json') -Raw | ConvertFrom-Json
          if ($newPkg.version -ne '0.1.9') { throw "unexpected upgraded package version $($newPkg.version)" }
          $newMarker = Get-Content (Join-Path $target '.jobquay-install.json') -Raw | ConvertFrom-Json
          if ($newMarker.installId -ne $oldMarker.installId) { throw 'in-place upgrade changed the managed installation identity' }
          ./scripts/assert-windows-installed-app.ps1 -Version 0.1.9 -InstallLocation $target

          $fakeCodexAfterUpgrade = Get-Content $env:CREWDISPATCH_FAKE_CODEX_STATE -Raw | ConvertFrom-Json
          if (-not $fakeCodexAfterUpgrade.marketplace -or -not $fakeCodexAfterUpgrade.plugin) { throw 'Codex plugin/marketplace registration did not survive the upgrade' }

          $uninstaller = Join-Path $target 'Uninstall.exe'
          $remove = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "upgraded uninstall failed: $($remove.ExitCode)" }
          if (Test-Path $target) { throw 'upgraded install target survived uninstall' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CrewDispatch') { throw 'upgraded Installed Apps registration survived uninstall' }
          $fakeCodexAfterUninstall = Get-Content $env:CREWDISPATCH_FAKE_CODEX_STATE -Raw | ConvertFrom-Json
          if ($fakeCodexAfterUninstall.plugin -or $fakeCodexAfterUninstall.marketplace) { throw 'upgraded Codex plugin/marketplace registration survived uninstall' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CrewDispatch-0.1.9-windows-installer-ci
          path: |
            installer-out/CrewDispatch-Setup-0.1.9.exe
            installer-out/windows-installer.json
            installer-out/windows-welcome.png
            installer-out/candidate/*.zip
            installer-out/candidate/*.json
            installer-out/candidate/*.sha256

  macos-payload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            expected_arch: arm64
            artifact_arch: arm64
          - os: macos-15-intel
            expected_arch: x64
            artifact_arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.arch')" = '${{ matrix.expected_arch }}'
      - run: npm run build
      - name: Verify complete-uninstall safety
        shell: bash
        run: node --test dist/tests/unit/data-root-purge.test.js dist/tests/integration/complete-uninstall.test.js
      - name: Build exact macOS payload
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$RUNNER_TEMP/crewdispatch-candidate"
          mkdir -p "$CANDIDATE"
          node scripts/build-release-candidate.cjs --output-dir "$CANDIDATE" --scope command-code+workbuddy-ai | tee "$CANDIDATE/report.stdout.json"
          ZIP="$(find "$CANDIDATE" -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p candidate-out
          cp "$CANDIDATE"/* candidate-out/
      - uses: actions/upload-artifact@v4
        with:
          name: CrewDispatch-0.1.9-macos-payload-${{ matrix.artifact_arch }}
          path: |
            candidate-out/*.zip
            candidate-out/*.json
            candidate-out/*.sha256

  macos-installer-package:
    needs: macos-payload
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: CrewDispatch-0.1.9-macos-payload-*
          path: candidates
          merge-multiple: true
      - name: Build dual-architecture package
        shell: bash
        run: |
          set -euo pipefail
          ARM="$(find candidates -maxdepth 1 -name 'crewdispatch-0.1.9-darwin-arm64-*.zip' -print -quit)"
          X64="$(find candidates -maxdepth 1 -name 'crewdispatch-0.1.9-darwin-x64-*.zip' -print -quit)"
          test -n "$ARM"
          test -n "$X64"
          mkdir -p installer-out
          node scripts/build-macos-installer.cjs --arm64-archive "$ARM" --x64-archive "$X64" --output installer-out/CrewDispatch-0.1.9.pkg | tee installer-out/macos-installer.json
          /bin/zsh -n installers/macos/postinstall
          pkgutil --expand installer-out/CrewDispatch-0.1.9.pkg installer-out/expanded
          test -f installer-out/expanded/Scripts/postinstall
          test -f installer-out/expanded/Scripts/payload-arm64.zip
          test -f installer-out/expanded/Scripts/payload-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CrewDispatch-0.1.9-macos-installer-ci
          path: |
            installer-out/CrewDispatch-0.1.9.pkg
            installer-out/macos-installer.json

  macos-installer-lifecycle:
    needs: macos-installer-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            expected_uname: arm64
          - os: macos-15-intel
            expected_uname: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          name: CrewDispatch-0.1.9-macos-installer-ci
          path: installer-out
      - name: Upgrade immutable 0.1.8 package and completely uninstall the exact 0.1.9 package
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.expected_uname }}'
          NODE_DIR="$(dirname "$(command -v node)")"
          printf 'export PATH="%s:$PATH"\n' "$NODE_DIR" >> "$HOME/.zprofile"
          ORIGINAL_CONSOLE_OWNER="$(stat -f '%Su:%Sg' /dev/console)"
          sudo chown "$USER:$(id -gn)" /dev/console
          restore_console() { sudo chown "$ORIGINAL_CONSOLE_OWNER" /dev/console || true; }
          trap restore_console EXIT

          BASELINE="$RUNNER_TEMP/CrewDispatch-0.1.8.pkg"
          curl -fL --retry 3             'https://github.com/andrewngcanton-gif/crewdispatch/releases/download/v0.1.8/CrewDispatch-0.1.8.pkg'             -o "$BASELINE"
          BASELINE_SHA="$(shasum -a 256 "$BASELINE" | awk '{print $1}')"
          test "$BASELINE_SHA" = '3db91354319deadfc70680c5c91f8284e0abf9d550d38b73407917f07f6b75c4'
          if ! sudo installer -pkg "$BASELINE" -target /; then
            sudo tail -n 200 /var/log/install.log || true
            exit 1
          fi
          TARGET="$HOME/Library/Application Support/CrewDispatch/runtime"
          test -f "$TARGET/.jobquay-install.json"
          test "$(node -p "require(process.argv[1]).version" "$TARGET/package.json")" = '0.1.8'
          OLD_INSTALL_ID="$(node -p "require(process.argv[1]).installId" "$TARGET/.jobquay-install.json")"
          test -n "$OLD_INSTALL_ID"

          if ! sudo installer -pkg installer-out/CrewDispatch-0.1.9.pkg -target /; then
            sudo tail -n 200 /var/log/install.log || true
            exit 1
          fi
          test -f "$TARGET/.jobquay-install.json"
          test "$(node -p "require(process.argv[1]).version" "$TARGET/package.json")" = '0.1.9'
          NEW_INSTALL_ID="$(node -p "require(process.argv[1]).installId" "$TARGET/.jobquay-install.json")"
          test "$NEW_INSTALL_ID" = "$OLD_INSTALL_ID"
          test -f "$HOME/.codex/prompts/crewdispatch.md"
          test -f "$HOME/.codex/crewdispatch-install.json"
          test -f "$HOME/.claude/commands/crewdispatch.md"
          test -f "$HOME/.claude/skills/crewdispatch/SKILL.md"
          test -f "$HOME/.claude/crewdispatch-install.json"
          test -f "$HOME/.claude.json"
          node -e 'const c=require(process.argv[1]); if (!c.mcpServers || !c.mcpServers.crewdispatch) process.exit(1)' "$HOME/.claude.json"
          test -f "$HOME/.claude/settings.json"
          node -e 'const c=require(process.argv[1]); if (!c.hooks || !c.hooks.SessionStart || !c.hooks.SessionEnd) process.exit(1)' "$HOME/.claude/settings.json"
          test -x "$HOME/Applications/CrewDispatch Dashboard.command"
          test -x "$HOME/Applications/CrewDispatch Uninstaller.command"
          case '${{ matrix.expected_uname }}' in
            arm64) file "$TARGET/dist/native/macos-process-info" | grep -q 'arm64' ;;
            x86_64) file "$TARGET/dist/native/macos-process-info" | grep -q 'x86_64' ;;
          esac
          printf 'y\n\n' | "$HOME/Applications/CrewDispatch Uninstaller.command"
          test ! -e "$TARGET"
          test ! -e "$HOME/Library/Application Support/CrewDispatch"
          test ! -e "$HOME/Library/Application Support/JobQuay"
          test ! -e "$HOME/Library/LaunchAgents/com.crewdispatch.dashboard.plist"
          test ! -e "$HOME/Applications/CrewDispatch Dashboard.command"
          test ! -e "$HOME/Applications/CrewDispatch Uninstaller.command"
          test ! -e "$HOME/.codex/prompts/crewdispatch.md"
          test ! -e "$HOME/.codex/crewdispatch-install.json"
          test ! -e "$HOME/.claude/commands/crewdispatch.md"
          test ! -e "$HOME/.claude/skills/crewdispatch/SKILL.md"
          test ! -e "$HOME/.claude/crewdispatch-install.json"
          if [[ -f "$HOME/.claude.json" ]]; then
            node -e 'const c=require(process.argv[1]); if (c.mcpServers && c.mcpServers.crewdispatch) process.exit(1)' "$HOME/.claude.json"
            if [[ -f "$HOME/.claude/settings.json" ]]; then
              node -e 'const c=require(process.argv[1]); if (c.hooks && (c.hooks.SessionStart || c.hooks.SessionEnd)) process.exit(1)' "$HOME/.claude/settings.json"
            fi
          fi
          if pkgutil --pkg-info com.crewdispatch.installer >/dev/null 2>&1; then
            echo 'package receipt survived uninstall' >&2
            exit 1
          fi
